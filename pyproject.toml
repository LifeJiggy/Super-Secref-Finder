[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "super-secref-finder"
version = "8.3.0"
description = "High-signal secret scanner for web apps, GitHub repos, git history, and CI — 128 rules, source maps, SARIF, and live validation."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "ArkhAngelLifeJiggy", email = "Bloomtonjovish@gmail.com"},
]
maintainers = [
    {name = "ArkhAngelLifeJiggy", email = "Bloomtonjovish@gmail.com"},
]
keywords = [
    "security", "secrets", "secret-scanning", "sast", "regex",
    "api-key", "credential", "pentest", "sarif", "devsecops",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=5.0",
]
aws = [
    "boto3>=1.26",
]
all = [
    "boto3>=1.26",
]

[project.urls]
Homepage = "https://github.com/LifeJiggy/Super-Secref-Finder"
Repository = "https://github.com/LifeJiggy/Super-Secref-Finder"
Documentation = "https://github.com/LifeJiggy/Super-Secref-Finder#readme"
Issues = "https://github.com/LifeJiggy/Super-Secref-Finder/issues"
Changelog = "https://github.com/LifeJiggy/Super-Secref-Finder/blob/main/CHANGELOG.md"
Security = "https://github.com/LifeJiggy/Super-Secref-Finder/blob/main/SECURITY.md"

[project.scripts]
super-secref-finder = "src.__main__:main"
secref = "src.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["*.yaml", "*.yml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py38"
exclude = [".git", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E9", "F", "W6"]
ignore = ["F401"]
